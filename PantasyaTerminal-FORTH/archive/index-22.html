<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pantasya Terminal</title>
    <style>
        body {
            background-color: #121212;
            color: #ffcd75;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h2 { font-size: 14px; margin: 5px; color: #73eff7; }
        #console-container {
            border: 4px solid #29366f;
            background: #1a1c2c;
            width: 512px;
            height: 512px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            width: 512px;
            height: 512px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }
        #hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h2>PANTASYA TERMINAL</h2>
    <div id="console-container" onclick="document.getElementById('hidden-input').focus()">
        <canvas id="screen" width="128" height="128"></canvas>
        <input type="text" id="hidden-input" autofocus autocomplete="off" spellcheck="false">
    </div>

<script>
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const hiddenInput = document.getElementById('hidden-input');

    // Sweetie 16 Palette by GrafxKid
    const PALETTE = [
        "#1a1c2c", "#5d275d", "#b13e53", "#ef7d57",
        "#ffcd75", "#a7f070", "#38b764", "#257179",
        "#29366f", "#3b5dc9", "#41a6f6", "#73eff7",
        "#f4f4f4", "#94b0c2", "#566c86", "#333c57"
    ];

    let fb = ctx.createImageData(128, 128);
    let currentBgColor = 0;
    let cursorVisible = true;

    function cls(col = 0) {
        currentBgColor = col % 16;
        let rgb = hexToRgb(PALETTE[currentBgColor]);
        for (let i = 0; i < fb.data.length; i += 4) {
            fb.data[i] = rgb.r;
            fb.data[i+1] = rgb.g;
            fb.data[i+2] = rgb.b;
            fb.data[i+3] = 255;
        }
    }

    function pset(x, y, col) {
        x = Math.floor(x); y = Math.floor(y);
        if (x < 0 || x > 127 || y < 0 || y > 127) return;
        let idx = (y * 128 + x) * 4;
        let rgb = hexToRgb(PALETTE[col % 16]);
        fb.data[idx] = rgb.r;
        fb.data[idx+1] = rgb.g;
        fb.data[idx+2] = rgb.b;
        fb.data[idx+3] = 255;
    }

    function updateScreen() {
        ctx.putImageData(fb, 0, 0);
    }

    function hexToRgb(hex) {
        let bigint = parseInt(hex.slice(1), 16);
        return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
    }

    // Authentic MS-DOS / Code Page 437 8x8 Character Set
    const FONT_DOS_8X8 = {
        0: [0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00],
        32: [0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00],
        33: [0x18,0x3C,0x3C,0x18,0x18,0x00,0x18,0x00],
        34: [0x66,0x66,0x24,0x00,0x00,0x00,0x00,0x00],
        35: [0x36,0x36,0x7F,0x36,0x7F,0x36,0x36,0x00],
        36: [0x18,0x3E,0x60,0x3C,0x06,0x7C,0x18,0x00],
        37: [0x63,0x63,0x0C,0x18,0x30,0x63,0x63,0x00],
        38: [0x30,0x68,0x68,0x30,0x5B,0x66,0x3B,0x00],
        39: [0x18,0x18,0x0C,0x00,0x00,0x00,0x00,0x00],
        40: [0x0C,0x18,0x30,0x30,0x30,0x18,0x0C,0x00],
        41: [0x30,0x18,0x0C,0x0C,0x0C,0x18,0x30,0x00],
        42: [0x00,0x24,0x66,0xFF,0x66,0x24,0x00,0x00],
        43: [0x00,0x18,0x18,0x7E,0x18,0x18,0x00,0x00],
        44: [0x00,0x00,0x00,0x00,0x00,0x18,0x18,0x30],
        45: [0x00,0x00,0x00,0x7E,0x00,0x00,0x00,0x00],
        46: [0x00,0x00,0x00,0x00,0x00,0x18,0x18,0x00],
        47: [0x03,0x06,0x0C,0x18,0x30,0x60,0xC0,0x00],
        48: [0x3C,0x66,0x6E,0x76,0x66,0x66,0x3C,0x00],
        49: [0x18,0x38,0x18,0x18,0x18,0x18,0x7E,0x00],
        50: [0x3C,0x66,0x06,0x1C,0x30,0x60,0x7E,0x00],
        51: [0x3C,0x66,0x06,0x1C,0x06,0x66,0x3C,0x00],
        52: [0x0C,0x1C,0x34,0x64,0x7E,0x04,0x04,0x00],
        53: [0x7E,0x60,0x7C,0x06,0x06,0x66,0x3C,0x00],
        54: [0x3C,0x60,0x7C,0x66,0x66,0x66,0x3C,0x00],
        55: [0x7E,0x06,0x0C,0x18,0x30,0x30,0x30,0x00],
        56: [0x3C,0x66,0x66,0x3C,0x66,0x66,0x3C,0x00],
        57: [0x3C,0x66,0x66,0x3E,0x06,0x0C,0x38,0x00],
        58: [0x00,0x18,0x18,0x00,0x00,0x18,0x18,0x00],
        59: [0x00,0x18,0x18,0x00,0x00,0x18,0x18,0x30],
        60: [0x0C,0x18,0x30,0x60,0x30,0x18,0x0C,0x00],
        61: [0x00,0x00,0x7E,0x00,0x00,0x7E,0x00,0x00],
        62: [0x30,0x18,0x0C,0x06,0x0C,0x18,0x30,0x00],
        63: [0x3C,0x66,0x0C,0x18,0x18,0x00,0x18,0x00],
        64: [0x3C,0x66,0x6E,0x6A,0x6E,0x60,0x3C,0x00],
        65: [0x18,0x3C,0x66,0x66,0x7E,0x66,0x66,0x00],
        66: [0x7C,0x66,0x66,0x7C,0x66,0x66,0x7C,0x00],
        67: [0x3C,0x66,0x60,0x60,0x60,0x66,0x3C,0x00],
        68: [0x78,0x6C,0x66,0x66,0x66,0x6C,0x78,0x00],
        69: [0x7E,0x60,0x60,0x7C,0x60,0x60,0x7E,0x00],
        70: [0x7E,0x60,0x60,0x7C,0x60,0x60,0x60,0x00],
        71: [0x3C,0x66,0x60,0x6E,0x66,0x66,0x3C,0x00],
        72: [0x66,0x66,0x66,0x7E,0x66,0x66,0x66,0x00],
        73: [0x3C,0x18,0x18,0x18,0x18,0x18,0x3C,0x00],
        74: [0x1E,0x0C,0x0C,0x0C,0x0C,0x6C,0x38,0x00],
        75: [0x66,0x6C,0x78,0x70,0x78,0x6C,0x66,0x00],
        76: [0x60,0x60,0x60,0x60,0x60,0x60,0x7E,0x00],
        77: [0x63,0x77,0x7F,0x6B,0x63,0x63,0x63,0x00],
        78: [0x66,0x76,0x7E,0x6E,0x66,0x66,0x66,0x00],
        79: [0x3C,0x66,0x66,0x66,0x66,0x66,0x3C,0x00],
        80: [0x7C,0x66,0x66,0x7C,0x60,0x60,0x60,0x00],
        81: [0x3C,0x66,0x66,0x66,0x6A,0x6C,0x3A,0x00],
        82: [0x7C,0x66,0x66,0x7C,0x78,0x6C,0x66,0x00],
        83: [0x3C,0x66,0x60,0x3C,0x06,0x66,0x3C,0x00],
        84: [0x7E,0x18,0x18,0x18,0x18,0x18,0x18,0x00],
        85: [0x66,0x66,0x66,0x66,0x66,0x66,0x3C,0x00],
        86: [0x66,0x66,0x66,0x66,0x66,0x3C,0x18,0x00],
        87: [0x63,0x63,0x63,0x6B,0x7F,0x77,0x63,0x00],
        88: [0x66,0x66,0x3C,0x18,0x3C,0x66,0x66,0x00],
        89: [0x66,0x66,0x66,0x3C,0x18,0x18,0x18,0x00],
        90: [0x7E,0x06,0x0C,0x18,0x30,0x60,0x7E,0x00],
        91: [0x3C,0x30,0x30,0x30,0x30,0x30,0x3C,0x00],
        92: [0xC0,0x60,0x30,0x18,0x0C,0x06,0x03,0x00],
        93: [0x3C,0x0C,0x0C,0x0C,0x0C,0x0C,0x3C,0x00],
        94: [0x18,0x3C,0x66,0x00,0x00,0x00,0x00,0x00],
        95: [0x00,0x00,0x00,0x00,0x00,0x00,0x00,0xFF],
        96: [0x30,0x18,0x0C,0x00,0x00,0x00,0x00,0x00],
        97: [0x00,0x00,0x3C,0x06,0x3E,0x66,0x3E,0x00],
        98: [0x60,0x60,0x7C,0x66,0x66,0x66,0x7C,0x00],
        99: [0x00,0x00,0x3C,0x60,0x60,0x60,0x3C,0x00],
        100: [0x06,0x06,0x3E,0x66,0x66,0x66,0x3E,0x00],
        101: [0x00,0x00,0x3C,0x66,0x7E,0x60,0x3C,0x00],
        102: [0x1C,0x30,0x7C,0x30,0x30,0x30,0x30,0x00],
        103: [0x00,0x00,0x3E,0x66,0x66,0x3E,0x06,0x3C],
        104: [0x60,0x60,0x7C,0x66,0x66,0x66,0x66,0x00],
        105: [0x18,0x00,0x38,0x18,0x18,0x18,0x3C,0x00],
        106: [0x06,0x00,0x06,0x06,0x06,0x66,0x66,0x3C],
        107: [0x60,0x60,0x6C,0x78,0x70,0x6C,0x66,0x00],
        108: [0x38,0x18,0x18,0x18,0x18,0x18,0x3C,0x00],
        109: [0x00,0x00,0xEC,0xFE,0xD6,0xD6,0xD6,0x00],
        110: [0x00,0x00,0x7C,0x66,0x66,0x66,0x66,0x00],
        111: [0x00,0x00,0x3C,0x66,0x66,0x66,0x3C,0x00],
        112: [0x00,0x00,0x7C,0x66,0x66,0x7C,0x60,0x60],
        113: [0x00,0x00,0x3E,0x66,0x66,0x3E,0x06,0x06],
        114: [0x00,0x00,0x7C,0x66,0x60,0x60,0x60,0x00],
        115: [0x00,0x00,0x3C,0x60,0x3C,0x06,0x7C,0x00],
        116: [0x30,0x30,0x7C,0x30,0x30,0x30,0x1C,0x00],
        117: [0x00,0x00,0x66,0x66,0x66,0x66,0x3E,0x00],
        118: [0x00,0x00,0x66,0x66,0x66,0x3C,0x18,0x00],
        119: [0x00,0x00,0x63,0x6B,0x7F,0x7F,0x36,0x00],
        120: [0x00,0x00,0x66,0x3C,0x18,0x3C,0x66,0x66,0x00],
        121: [0x00,0x00,0x66,0x66,0x66,0x3E,0x0C,0x78],
        122: [0x00,0x00,0x7E,0x0C,0x18,0x30,0x7E,0x00],
        123: [0x0E,0x18,0x18,0x70,0x18,0x18,0x0E,0x00],
        124: [0x18,0x18,0x18,0x18,0x18,0x18,0x18,0x00],
        125: [0x70,0x18,0x18,0x0E,0x18,0x18,0x70,0x00],
        126: [0x76,0xDC,0x00,0x00,0x00,0x00,0x00,0x00],
        127: [0x10,0x38,0x7C,0xFE,0x7C,0x38,0x10,0x00]
    };

    function printChar(ch, x, y, col = 12) {
        let code = typeof ch === 'string' ? ch.charCodeAt(0) : ch;
        let glyph = FONT_DOS_8X8[code] || FONT_DOS_8X8[63];
        if (!glyph) return;
        for (let row = 0; row < 8; row++) {
            let bits = glyph[row];
            for (let bit = 0; bit < 8; bit++) {
                if ((bits >> (7 - bit)) & 1) {
                    pset(x + bit, y + row, col);
                }
            }
        }
    }

    function printText(str, x, y, col = 12) {
        str = String(str);
        let cx = x;
        let cy = y;
        for (let i = 0; i < str.length; i++) {
            if (cx + 8 > 128) { cx = 0; cy += 8; }
            if (cy + 8 > 128) break; 
            printChar(str[i], cx, cy, col);
            cx += 8;
        }
    }

    // Terminal State
    const COLS = 16;
    const ROWS = 16; 
    let termBuffer = [];
    let scrollOffset = 0;
    let currentInput = "";
    let cursorPosition = 0;
    let commandHistory = [];
    let historyIndex = -1;
    let promptStartIndex = 0;

    // Forth Machine State
    let forthStack = [];
    let loopStack = []; 
    let forthDictionary = {
        "+": () => { let b = forthStack.pop(), a = forthStack.pop(); forthStack.push(a + b); },
        "-": () => { let b = forthStack.pop(), a = forthStack.pop(); forthStack.push(a - b); },
        "*": () => { let b = forthStack.pop(), a = forthStack.pop(); forthStack.push(a * b); },
        "/": () => { let b = forthStack.pop(), a = forthStack.pop(); forthStack.push(a / b); },
        ".": () => { let val = forthStack.pop(); writeTerminal(val !== undefined ? String(val) : "STACK EMPTY"); },
        "EMIT": () => { 
            let val = forthStack.pop(); 
            if (val !== undefined) writeTerminal(String.fromCharCode(val & 0xFF));
            else writeTerminal("STACK EMPTY");
        },
        ".S": () => { writeTerminal("<" + forthStack.length + "> " + forthStack.join(" ")); },
        "DUP": () => { if (forthStack.length > 0) forthStack.push(forthStack[forthStack.length - 1]); },
        "DROP": () => { forthStack.pop(); },
        "SWAP": () => { let b = forthStack.pop(), a = forthStack.pop(); forthStack.push(b, a); },
        
        // Loop counters i, j, k
        "I": () => {
            if (loopStack.length > 0) forthStack.push(loopStack[loopStack.length - 1].index);
            else writeTerminal("FORTH ERR: NO ACTIVE LOOP FOR I");
        },
        "J": () => {
            if (loopStack.length > 1) forthStack.push(loopStack[loopStack.length - 2].index);
            else writeTerminal("FORTH ERR: NO NESTED LOOP FOR J");
        },
        "K": () => {
            if (loopStack.length > 2) forthStack.push(loopStack[loopStack.length - 3].index);
            else writeTerminal("FORTH ERR: NO NESTED LOOP FOR K");
        },

        "HELP": () => {
            writeTerminal("CMDS: HELP, CLS, PAL, REBOOT, ASCII");
            writeTerminal("FORTH STACK LANG READY");
        },
        "ASCII": () => {
            let line = "";
            for (let i = 32; i < 128; i++) {
                line += String.fromCharCode(i);
                if (i % 32 === 31) { writeTerminal(line); line = ""; }
            }
        },
        "CLS": () => { 
            let col = forthStack.length > 0 ? forthStack.pop() : 0; 
            cls(col); termBuffer = []; scrollOffset = 0; redrawTerminal();
        },
        "PAL": () => {
            PALETTE.forEach((hex, i) => writeTerminal(`${String(i).padStart(2)}: ${hex}`));
        },
        "REBOOT": () => {
            writeTerminal("REBOOTING...");
            setTimeout(() => {
                commandHistory = []; historyIndex = -1; currentBgColor = 0;
                forthStack = []; loopStack = []; initTerminal();
            }, 600);
        },
        "PSET": () => { 
            let col = forthStack.pop(), y = forthStack.pop(), x = forthStack.pop();
            pset(x, y, col); updateScreen();
        }
    };

    let compiling = false;
    let newWordName = "";
    let newWordTokens = [];

    function runForth(tokensOrString) {
        let tokens = typeof tokensOrString === 'string' ? tokensOrString.trim().split(/\s+/) : tokensOrString;
        
        for (let i = 0; i < tokens.length; i++) {
            let tok = tokens[i];
            if (!tok) continue;
            let upper = tok.toUpperCase();

            if (compiling) {
                if (upper === ";") {
                    forthDictionary[newWordName] = [...newWordTokens];
                    compiling = false;
                    writeTerminal("compiled: " + newWordName);
                } else {
                    newWordTokens.push(tok);
                }
                continue;
            }

            if (upper === ":") {
                compiling = true;
                newWordName = tokens[++i].toUpperCase();
                newWordTokens = [];
                continue;
            }

            // Handle DO ... LOOP properly with index tracking
            if (upper === "DO") {
                let limit = forthStack.pop();
                let start = forthStack.pop();
                if (limit === undefined || start === undefined) {
                    writeTerminal("FORTH ERR: STACK UNDERFLOW FOR DO");
                    break;
                }

                // Collect body tokens up to matching LOOP
                let bodyTokens = [];
                let nestLevel = 1;
                let jIdx = i + 1;
                while (jIdx < tokens.length) {
                    let nextTok = tokens[jIdx].toUpperCase();
                    if (nextTok === "DO") nestLevel++;
                    else if (nextTok === "LOOP") {
                        nestLevel--;
                        if (nestLevel === 0) break;
                    }
                    bodyTokens.push(tokens[jIdx]);
                    jIdx++;
                }

                if (nestLevel > 0) {
                    writeTerminal("FORTH ERR: UNMATCHED DO");
                    break;
                }

                let loopObj = { index: start, limit: limit };
                loopStack.push(loopObj);

                let loopFailed = false;
                while (loopObj.index < loopObj.limit) {
                    try {
                        runForth(bodyTokens);
                    } catch (err) {
                        writeTerminal("ERR: " + err.message);
                        loopFailed = true;
                        break;
                    }
                    loopObj.index++;
                }

                loopStack.pop();
                i = jIdx; // Jump past LOOP token
                if (loopFailed) break;
                continue;
            }

            if (forthDictionary[upper] !== undefined) {
                let entry = forthDictionary[upper];
                if (typeof entry === "function") {
                    entry();
                } else if (Array.isArray(entry)) {
                    runForth(entry);
                }
            } else {
                let num = parseFloat(tok);
                if (!isNaN(num)) {
                    forthStack.push(num);
                } else {
                    writeTerminal("FORTH ERR: " + tok + "?");
                    break;
                }
            }
        }
    }

    function initTerminal() {
        cls(0);
        termBuffer = ["PANTASYA v1.0 + FORTH"];
        scrollOffset = Math.max(0, getCombinedLines().length - ROWS);
        redrawTerminal();
    }

    function writeTerminal(text) {
        let lines = String(text).split("\n");
        lines.forEach(l => {
            while(l.length > COLS) {
                termBuffer.push(l.slice(0, COLS));
                l = l.slice(COLS);
            }
            termBuffer.push(l);
        });
        scrollOffset = Math.max(0, getCombinedLines().length - ROWS);
        redrawTerminal();
    }

    function getWrappedLines(str) {
        let wrapped = [];
        let s = String(str);
        if (s.length === 0) return [""];
        for (let i = 0; i < s.length; i += COLS) {
            wrapped.push(s.slice(i, i + COLS));
        }
        return wrapped;
    }

    function getCombinedLines() {
        let expandedBuffer = [];
        for (let i = 0; i < termBuffer.length; i++) {
            let wLines = getWrappedLines(termBuffer[i]);
            for (let w = 0; w < wLines.length; w++) {
                expandedBuffer.push(wLines[w]);
            }
        }
        let fullPrompt = ">" + currentInput;
        let promptLines = getWrappedLines(fullPrompt);
        promptStartIndex = expandedBuffer.length;
        return expandedBuffer.concat(promptLines);
    }

    function redrawTerminal() {
        cls(currentBgColor);
        let combined = getCombinedLines();
        let maxScroll = Math.max(0, combined.length - ROWS);
        if (scrollOffset > maxScroll) scrollOffset = maxScroll;
        if (scrollOffset < 0) scrollOffset = 0;

        for (let i = 0; i < ROWS; i++) {
            let lineIdx = scrollOffset + i;
            if (lineIdx < combined.length) {
                let lineText = combined[lineIdx];
                let isPromptLine = lineIdx >= promptStartIndex;
                printText(lineText, 0, i * 8, isPromptLine ? 5 : 13);
            }
        }

        if (cursorVisible) {
            let absoluteCursorIdx = cursorPosition + 1; 
            let promptWrappedLines = getWrappedLines(">" + currentInput);
            let currentLocalRow = 0, currentLocalCol = 0, charCount = 0;

            for (let r = 0; r < promptWrappedLines.length; r++) {
                let len = promptWrappedLines[r].length;
                if (absoluteCursorIdx <= charCount + len) {
                    currentLocalRow = r;
                    currentLocalCol = absoluteCursorIdx - charCount;
                    break;
                }
                charCount += len;
                if (r === promptWrappedLines.length - 1 && absoluteCursorIdx === charCount) {
                    currentLocalRow = r;
                    currentLocalCol = promptWrappedLines[r].length;
                }
            }

            let cursorScreenLineIndex = (promptStartIndex + currentLocalRow) - scrollOffset;
            if (cursorScreenLineIndex >= 0 && cursorScreenLineIndex < ROWS) {
                let cursorX = currentLocalCol * 8;
                let cursorY = cursorScreenLineIndex * 8;
                if (cursorX < 128) {
                    let charUnderCursor = promptWrappedLines[currentLocalRow]?.[currentLocalCol] || " ";
                    for (let cy = 0; cy < 8; cy++) {
                        for (let cx = 0; cx < 8; cx++) {
                            pset(cursorX + cx, cursorY + cy, 5);
                        }
                    }
                    if (charUnderCursor !== " ") printChar(charUnderCursor, cursorX, cursorY, 0);
                }
            }
        }
        updateScreen();
    }

    setInterval(() => {
        cursorVisible = !cursorVisible;
        redrawTerminal();
    }, 400);

    hiddenInput.addEventListener('keydown', (e) => {
        cursorVisible = true;
        if (e.key === 'Enter') {
            let cmd = currentInput.trim();
            writeTerminal(">" + currentInput);
            if (cmd) commandHistory.push(currentInput);
            currentInput = ""; cursorPosition = 0; historyIndex = commandHistory.length;
            if (cmd) {
                try { runForth(cmd); } catch (err) { writeTerminal("ERR: " + err.message); }
            } else { redrawTerminal(); }
            e.preventDefault();
        } else if (e.key === 'Backspace') {
            if (cursorPosition > 0) {
                currentInput = currentInput.slice(0, cursorPosition - 1) + currentInput.slice(cursorPosition);
                cursorPosition--;
                redrawTerminal();
            }
            e.preventDefault();
        } else if (e.key === 'ArrowLeft' && cursorPosition > 0) {
            cursorPosition--; redrawTerminal(); e.preventDefault();
        } else if (e.key === 'ArrowRight' && cursorPosition < currentInput.length) {
            cursorPosition++; redrawTerminal(); e.preventDefault();
        } else if (e.key === 'ArrowUp') {
            if (commandHistory.length > 0) {
                if (historyIndex > 0) historyIndex--;
                currentInput = commandHistory[historyIndex] || "";
                cursorPosition = currentInput.length;
                redrawTerminal();
            }
            e.preventDefault();
        } else if (e.key === 'ArrowDown') {
            if (commandHistory.length > 0) {
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++; currentInput = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length; currentInput = "";
                }
                cursorPosition = currentInput.length;
                redrawTerminal();
            }
            e.preventDefault();
        } else if (e.key.length === 1) {
            currentInput = currentInput.slice(0, cursorPosition) + e.key + currentInput.slice(cursorPosition);
            cursorPosition++; redrawTerminal(); e.preventDefault();
        }
    });

    initTerminal();
</script>
